quarkus.application.name=notary

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bob
quarkus.datasource.username=bob
quarkus.datasource.password=bob

# Schema is managed by Flyway (src/main/resources/db/migration)
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.notary".level=DEBUG

# Dev: log SQL
%dev.quarkus.hibernate-orm.log.sql=true
