# Quarkus Application Configuration
quarkus.application.name=notary
quarkus.application.version=1.0.0

# PostgreSQL Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bob
quarkus.datasource.username=bob
quarkus.datasource.password=bob

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.notary".level=DEBUG

# Development mode configuration
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bob
%dev.quarkus.hibernate-orm.log.sql=true